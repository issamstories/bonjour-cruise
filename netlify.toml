# Netlify configuration for BONJOUR CRUISE
# Deploy with: netlify deploy --prod

[build]
  command = "npm run build"
  publish = "dist"

# Pretty URLs: /experiences resolves to /experiences.html
[[redirects]]
  from = "/experiences"
  to = "/experiences.html"
  status = 200

