[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # One year of HTTPS-only, subdomains included. No `preload` token: that is a
    # one-way commitment to the browser preload list and needs Issam's explicit
    # go-ahead once every subdomain is confirmed HTTPS-ready.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # The site never asks for location, camera, microphone or the Payment
    # Request API (checkout happens on Stripe's own domain), so deny all four.
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    # REPORT-ONLY on purpose. This allowlist is derived from the code that
    # actually runs (Google Fonts, the Supabase project, EmailJS, Stripe
    # Payment Links). Watch the browser console for violations for a couple of
    # weeks, then flip the header name to Content-Security-Policy to enforce.
    # `unsafe-inline` on style-src is required by the inline `style="..."`
    # attributes still present in the pages and by the per-language font CSS
    # injected at build time; removing them is the prerequisite to dropping it.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://vohocnkgdktssztsbirl.supabase.co wss://vohocnkgdktssztsbirl.supabase.co https://api.emailjs.com; form-action 'self' https://buy.stripe.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"

# Hashed build output: safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicons and touch icons are not content-hashed, so they get a finite TTL:
# one week is long enough to stop the repeat requests, short enough that a
# rebrand propagates without a support ticket.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Crawler files: correct Content-Type matters more than anything else here.
# Netlify serves .xml as application/xml already, but the sitemap is also
# reachable through the pretty URL, so pin it explicitly.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
